<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BlogSpace - Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>

        <nav class="navbar">

            <div class="logo">
                Blog<span>Space</span>
            </div>

            <div class="nav-links">

                <a href="index.html">Home</a>

                <a href="create-blog.html">
                    Create Blog
                </a>

                <a href="login.html">
                    Logout
                </a>

            </div>

        </nav>

    </header>


    <main class="dashboard">

        <div class="dashboard-header">

            <div>
                <h1>Dashboard</h1>

                <p>
                    Welcome back, Blogger! 👋
                </p>
            </div>

            <a href="create-blog.html" class="btn">
                + Create Blog
            </a>

        </div>


        <div class="stats">

            <div class="stat-card">

                <h3>5</h3>

                <p>Total Blogs</p>

            </div>


            <div class="stat-card">

                <h3>1.2K</h3>

                <p>Total Views</p>

            </div>


            <div class="stat-card">

                <h3>250</h3>

                <p>Likes</p>

            </div>

        </div>


        <h2 class="section-title">
            My Blogs
        </h2>


        <div class="blog-container">

            <div class="blog-card">

                <h3>
                    My First Blog
                </h3>

                <p>
                    This is my first blog post
                    created using BlogSpace.
                </p>

                <button>
                    Edit
                </button>

                <button class="delete-btn">
                    Delete
                </button>

            </div>


            <div class="blog-card">

                <h3>
                    Learning Web Development
                </h3>

                <p>
                    My experience learning HTML,
                    CSS and JavaScript.
                </p>

                <button>
                    Edit
                </button>

                <button class="delete-btn">
                    Delete
                </button>

            </div>

        </div>

    </main>


</body>
</html>
